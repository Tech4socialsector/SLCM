{% extends "templates/web.html" %}

{% block page_content %}

<div class="auth-container">

    <div class="auth-box">

        <h2 id="form-title">Login</h2>

        <!-- LOGIN FORM -->
        <form id="login-form">

            <input type="email" id="login-email" placeholder="Email" required>

            <input type="password" id="login-password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a href="#" onclick="showRegister()">Register</a>
            </p>

        </form>


        <!-- REGISTER FORM -->
        <form id="register-form" style="display:none;">

            <input type="email" id="register-email" placeholder="Email" required>

            <input type="tel" id="register-mobile" placeholder="Mobile Number" pattern="[0-9]{10,15}"
                title="Enter a valid mobile number" required>

            <button type="submit">Register</button>

            <p>
                Already have an account?
                <a href="#" onclick="showLogin()">Login</a>
            </p>

        </form>

    </div>

</div>


<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
    }

    .auth-box {
        width: 350px;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .auth-box input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .auth-box button {
        width: 100%;
        padding: 10px;
        background: #2490ef;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .auth-box button:hover {
        background: #0d6efd;
    }
</style>


<script>

    function showRegister() {
        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "block";
        document.getElementById("form-title").innerText = "Register";
    }

    function showLogin() {
        document.getElementById("login-form").style.display = "block";
        document.getElementById("register-form").style.display = "none";
        document.getElementById("form-title").innerText = "Login";
    }


    /* LOGIN */

    document.getElementById("login-form").onsubmit = function (e) {

        e.preventDefault();

        frappe.call({
            method: "login",
            args: {
                usr: document.getElementById("login-email").value,
                pwd: document.getElementById("login-password").value
            },
            callback: function (r) {

                if (r.message == "Logged In") {
                    window.location.href = "/app";
                }
            }
        });
    };


    /* REGISTER */

    document.getElementById("register-form").onsubmit = function (e) {

        e.preventDefault();

        frappe.call({
            method: "slcm.slcm.api.fle_sign_up",
            args: {
                email: document.getElementById("register-email").value,
                mobile_no: document.getElementById("register-mobile").value
            },
            callback: function (r) {
                if (r.message) {
                    // r.message is [status_code, text]
                    frappe.msgprint(r.message[1]);
                    if (r.message[0] === 1) {
                        document.getElementById("register-form").reset();
                        showLogin();
                    }
                }
            }
        });

    };

</script>

{% endblock %}
